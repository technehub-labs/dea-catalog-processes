# Process Contribution Template (v1)
# CR-BP-03 §9
#
# To add or re-classify a process, copy this file to
# contributions/processes/<your-id>.yaml and fill in the sections.
# Then open a PR; the CI process-contribution-report workflow
# (`.github/workflows/process-contribution-report.yml`) will:
#   1. validate the contribution against schemas/contribution.schema.json;
#   2. run scripts/check_process_identity.py on the proposed_entry;
#   3. emit a reclassification recommendation in
#      contributions/processes/<your-id>.report.md;
#   4. post the report as a PR comment.
#
# A catalog maintainer reviews the report before the entry lands
# in entities/v1-alpha/. The contribution does NOT auto-land.
#
# See docs/relandscape.md for the full lifecycle.
#
# ID convention: the proposed_entry id must follow
# `dea:process-<kebab-case-process-name>` (per CR-BP-02 PC-008
# + CR-BP-03C §2). This matches the entity-schema pattern and
# the Cell Charter's `processes` array pattern.

schema: dea-catalog-processes/contribution/v1
contributor: <github-handle>
contribution_date: <YYYY-MM-DD>

# === Process to add / re-classify ===
proposed_entry:
  id: dea:process-example-process
  name: Manage Example Process
  description: |
    A description of the process. Should reference the outcome
    (not the activity) and align with the process_type
    (see classifications/process-types.yaml).
  process_intent: management  # operational | support | management
  process_type: management   # strategic | management | core | support | standardization
  process_audience: customer-demand  # ecf-domain
  process_specialization:    # optional; list of parent process ids
    - dea:process-parent-process
  specialization_pattern: by-customer-segment  # optional free-text
  # Trigger (BP-ARC-ID-002): what initiates the process.
  trigger: |
    <what initiates this process>
  # Outcome (BP-ARC-ID-003): what the process produces.
  outcome: |
    <what the process produces — align with outcome_statement below>
  # Process Context (CR-BP-02): the bounded enterprise context.
  process_context: dea:pc-<domain-abbrev>-<stage-abbrev>
  identity:
    verb: Manage
    object: Example Process
    scope: <optional; e.g. (Enterprise)>
    outcome_statement: |
      The outcome statement describes what the process achieves,
      not what it does. Should be 1-2 sentences that name the
      state change / outcome. E.g. "Customer relationships are
      maintained, escalated where required, and renewed or
      terminated per policy."
    evidence_links:
      - type: documentation
        ref: docs/processes/example-process.md
      - type: governance
        ref: governance/example-process.md
  relationships:                # CR-BP-03 §6; CR-BP-03A §3.1
    - source_id: dea:process-example-process
      target_id: dea:process-parent-process
      relationship_type: composes
      status: active
      direction: source-to-target
      rationale: "Example process composes the parent process."
      asserted_by: <github-handle>
      asserted_at: <YYYY-MM-DD>
      provenance:
        type: manual
        asserted_by: <github-handle>
        asserted_at: <YYYY-MM-DD>
    - source_id: dea:process-example-process
      target_id: dea:entity-capability:example-capability
      relationship_type: realizes
      status: active
      direction: source-to-target
      rationale: "Example process realizes the example capability."
      asserted_by: <github-handle>
      asserted_at: <YYYY-MM-DD>
      provenance:
        type: manual
        asserted_by: <github-handle>
        asserted_at: <YYYY-MM-DD>
  # ECF Conformance Gate (CR-ECF-CG-001..004).
  ecfConformance:
    framework: EnterpriseConceptFramework
    contractVersion: '1.0.0'
    profile: dea:ecf@1.0.0
    status: conformant-with-extension
    affiliation: inherits-catalog
    canonicalReferences:
      - kind: coordinate
        domain: <PascalCase Domain>  # GovernanceAndExistence | SupplyAndResources | PeopleAndOrganization | CustomerAndDemand | ProductAndOffering | OperationsAndDelivery | FinanceAndValue
        stage: <PascalCase Stage>     # Conceive | Design | Build | Activate | Operate | Improve | Retire
        identifier: ecf:<lowerCamelDomain>.<lowerCamelStage>
    extensions:
      - name: process_intent
        doesNotRedefine: true
        rationaleRef: change-requests/CR-BP-SPEC-BP-01.md
      - name: process_type
        doesNotRedefine: true
        rationaleRef: change-requests/CR-BP-03-business-process-architecture.md
      - name: process_specialization
        doesNotRedefine: true
        rationaleRef: change-requests/CR-BP-03-business-process-architecture.md
      - name: process_audience
        doesNotRedefine: true
        rationaleRef: change-requests/CR-ECF-CG-004.md

# === Evidence supporting the contribution ===
evidence:
  - type: documentation
    ref: <link to internal documentation>
  - type: interview
    ref: <SME name + interview date>
  - type: artifact
    ref: <link to operational artifact>

# === Reviewer assignment ===
reviewer: <github-handle>   # unassigned → catalog maintainers team
status: pending

# === Re-landscape report (filled by CI) ===
# Contributors do NOT write this section. The CI contribution
# report workflow fills it.
report:
  generated_at: <YYYY-MM-DDTHH:MM:SSZ>
  report_path: contributions/processes/example-process.report.md
  recommendation: accept  # placeholder; CI will overwrite. accept | re-classify | reject
  current_state: {}
  suggested_state: {}
  confidence: 0.0
  rationale: <placeholder; CI will overwrite>
