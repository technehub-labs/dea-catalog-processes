name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-process-entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phase 2 deferred-population scaffold: the entities/ tree is empty
      # by design (only README.md placeholders). Skip validation cleanly
      # when there are no catalog entries yet. When Phase 2 starts adding
      # entries, drop the early-exit and let the action validate them.
      - name: Check for catalog entries
        id: check
        run: |
          shopt -s nullglob globstar
          count=0
          for f in entities/**/*.yaml entities/**/*.json; do
            [ -f "$f" ] && count=$((count + 1))
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No catalog entries to validate (Phase 2 not started). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate catalog entries against Process schema
        if: steps.check.outputs.skip != 'true'
        uses: dsanders11/json-schema-validate-action@v2.1.0
        with:
          schema: schemas/entity.schema.json
          files: |
            entities/**/*.yaml
            entities/**/*.json

      - name: Install ECF conformance gate dependencies
        run: pip install pyyaml

      - name: Run ECF conformance gate (CR-ECF-CG-004)
        run: python scripts/check_ecf_conformance.py

      - name: Run Business Process specialization gate (CR-BP-SPEC-BP-01)
        run: python scripts/check_process_specialization.py

      - name: Run Process Context gate (CR-BP-02)
        run: python scripts/check_process_context.py

      - name: Run Process Identity gate (CR-BP-03)
        run: python scripts/check_process_identity.py
