name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-process-entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validate YAML + JSON catalog entries against entity.schema.json.
      # Replaces the previously-pinned ajvdotpy/ajv-py-action@v1 — that
      # action repository does not exist on GitHub, so the workflow was
      # failing on action-resolution before any validation could run.
      # See the companion PRs in dea-catalog-business-objects and
      # dea-catalog-organizational-units for the full diagnostic.
      - name: Validate catalog entries against Process schema
        uses: dsanders11/json-schema-validate-action@v1
        with:
          schema: schemas/entity.schema.json
          files: |
            entities/**/*.yaml
            entities/**/*.json
