# Process Context Cell Charter: EnablementAndOperations x Improve.
#
# Lands as part of CR-BP-21d (EnablementAndOperations landing, fourth
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.6
# (Enablement & Operations: improvement of operations performance, logistics, asset utilization, and technology platforms).
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-oe-improve
domain: EnablementAndOperations
lifecycle_stage: Improve
name: Operations and Enablement Improvement

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **improving** the operations and enablement assets of the enterprise in the **Enablement & Operations** domain. This context addresses the learning and adaptation work of conducting operations performance reviews, logistics optimization, lean programmes, asset utilization optimization, and technology platform evolution. v2.4.0: absorbs asset utilization improvement from the dissolved Supply & Resources domain; supplier consolidation lives in party-relationship x improve (domain-grounding.md §3.6).

# Scope (PC-005).
scope:
  includes:
    - Operations performance review
    - Logistics optimization
    - Lean and continuous improvement programmes
    - Asset utilization optimization
    - Technology platform evolution
  excludes:
    - Operations performance operation (Operate stage; adjacent context)
    - Capability improvement (owning domains; adjacent domains)
    - Strategic adaptation (strategy-direction x improve; adjacent domain)
    - Supplier consolidation (party-relationship x improve; adjacent domain)

# Intended outcomes.
outcomes:
    - Operations performance review is conducted and findings committed.
    - Logistics optimization is delivered.
    - Lean programme results are realized.
    - Asset utilization is optimized.
    - Technology platforms are evolved.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-oe-conceive
    - dea:pc-oe-design
    - dea:pc-oe-build
    - dea:pc-oe-operate

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-conduct-operations-performance-review
    - dea:process-conduct-logistics-optimization
    - dea:process-conduct-lean-six-sigma-programme
    - dea:process-optimize-asset-utilization
    - dea:process-improve-technology-platforms

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Enablement & Operations: the improvement of the enterprise's execution engine and enabling assets."
  lifecycle_concern: "Improve: improving operations performance, logistics, asset utilization, and technology platforms."
  combined_semantic_meaning: |
    The learning and adaptation work of conducting operations performance reviews, logistics optimization, lean programmes, asset utilization optimization, and technology platform evolution.
  expected_outcomes:
    - Operations performance review is conducted and findings committed.
    - Logistics optimization is delivered.
    - Lean programme results are realized.
    - Asset utilization is optimized.
    - Technology platforms are evolved.
  inclusions:
    - Operations performance review
    - Logistics optimization
    - Lean and continuous improvement programmes
    - Asset utilization optimization
    - Technology platform evolution
  exclusions:
    - Operations performance operation (Operate stage; adjacent context)
    - Capability improvement (owning domains; adjacent domains)
    - Strategic adaptation (strategy-direction x improve; adjacent domain)
    - Supplier consolidation (party-relationship x improve; adjacent domain)
  adjacent_boundaries:
    - "dea:pc-oe-conceive (adjacent context): execution flow between Improve and the adjacent cell."
    - "dea:pc-oe-design (adjacent context): execution flow between Improve and the adjacent cell."
    - "dea:pc-oe-build (adjacent context): execution flow between Improve and the adjacent cell."
    - "dea:pc-oe-operate (adjacent context): execution flow between Improve and the adjacent cell."

