# Process Context Cell Charter: GovernanceAndExistence x Operate.
#
# Lands as part of CR-BP-13a (CustomerAndDemand admission tranche).
# This is the N-th Process Context cell in the catalog; the first
# was dea:pc-cd-op (CustomerAndDemand x Operate; CR-BP-03C).
#
# Each cell carries the full Cell Charter (CR-BP-02 §7):
#   enterprise_concern, lifecycle_concern, combined_semantic_meaning,
#   inclusions / exclusions, adjacent_boundaries.

id: dea:pc-ge-op
domain: GovernanceAndExistence
lifecycle_stage: Operate
name: Governance Oversight

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **operating** the governance oversight, board and committee cycles, risk oversight, and policy compliance execution in the **governance and existence** domain. This context addresses the day-to-day work of running the governance machinery: convening boards, executing risk reviews, auditing policy compliance, and making governance decisions.

# Scope (PC-005).
scope:
  includes:
    - Board and committee cycle operation
    - Risk oversight
    - Policy compliance execution
    - Audit and assurance
  excludes:
    - Strategy framing (Conceive stage)
    - Governance system design (Design stage)
    - Body establishment (Build stage)

# Intended outcomes.
outcomes:
  - Board and committee cycles run on schedule.
  - Risk is identified and mitigated.
  - Policy compliance is maintained.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
  - dea:pc-ge-c
  - dea:pc-ge-d
  - dea:pc-ge-b
  - dea:pc-ge-im

# Business Processes belonging to this context (PC-008).
processes:
  - dea:process-operate-governance-oversight
  - dea:process-audit-policy-compliance

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Governance and existence: the enterprise's mandate, policy posture, and charter direction."
  lifecycle_concern: "Operate: running the governance machinery on a continuous cycle."
  combined_semantic_meaning: |
    The day-to-day work of running the governance machinery: boards, committees, risk oversight, compliance execution.
  expected_outcomes:
    - Board and committee cycles run on schedule.
    - Risk is identified and mitigated.
    - Policy compliance is maintained.
  inclusions:
    - Board and committee cycle operation
    - Risk oversight
    - Policy compliance execution
  exclusions:
    - Strategy framing (Conceive stage)
    - Governance system design (Design stage)
    - Body establishment (Build stage)
  adjacent_boundaries:
    - "dea:pc-ge-c (Conceive): insights from operation shape strategy."
    - "dea:pc-ge-d (Design): operation reveals design gaps."
    - "dea:pc-ge-b (Build): operation runs the built governance bodies."
    - "dea:pc-ge-im (Improve): operation is reviewed and improved."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

