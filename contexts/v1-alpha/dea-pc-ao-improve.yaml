# Process Context Cell Charter: AgencyAndOrganization x Improve.
#
# Lands as part of CR-BP-21b (AgencyAndOrganization landing, second
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.3
# (Agency & Organization: improvement of agents and organization).
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-ao-improve
domain: AgencyAndOrganization
lifecycle_stage: Improve
name: Agent Development and Organization Improvement

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **improving** the agents and organization of the enterprise in the **Agency & Organization** domain. This context addresses the learning and adaptation work of conducting engagement and alignment reviews, capability gap analysis, reorganization, and agent performance improvement. v2.4.0: substrate-neutral — applies to biological, artificial, and hybrid agents without reclassification.

# Scope (PC-005).
scope:
  includes:
    - Engagement and alignment review
    - Capability gap analysis
    - Structure reorganization
    - Agent performance improvement
  excludes:
    - Agent performance operation (Operate stage; adjacent context)
    - Strategic adaptation (strategy-direction x improve; adjacent domain)
    - Capability improvement of receiving domains (owning domains)

# Intended outcomes.
outcomes:
    - Engagement and alignment review is conducted substrate-neutrally.
    - Capability gap analysis is conducted.
    - Structure reorganization is committed when needed.
    - Agent performance improvement is delivered.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-ao-conceive
    - dea:pc-ao-design
    - dea:pc-ao-build
    - dea:pc-ao-operate

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-develop-agents-and-organization
    - dea:process-conduct-engagement-and-alignment-review
    - dea:process-conduct-capability-gap-analysis
    - dea:process-reorganize-structures

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Agency & Organization: the improvement of the enterprise's agents and organization."
  lifecycle_concern: "Improve: improving engagement, capability, structure, and agent performance."
  combined_semantic_meaning: |
    The learning and adaptation work of improving engagement, capability, structure, and agent performance substrate-neutrally.
  expected_outcomes:
    - Engagement and alignment review is conducted substrate-neutrally.
    - Capability gap analysis is conducted.
    - Structure reorganization is committed when needed.
    - Agent performance improvement is delivered.
  inclusions:
    - Engagement and alignment review
    - Capability gap analysis
    - Structure reorganization
    - Agent performance improvement
  exclusions:
    - Agent performance operation (Operate stage; adjacent context)
    - Strategic adaptation (strategy-direction x improve; adjacent domain)
    - Capability improvement of receiving domains (owning domains)
  adjacent_boundaries:
    - "dea:pc-ao-conceive (adjacent context): agentive flow between Improve and the adjacent cell."
    - "dea:pc-ao-design (adjacent context): agentive flow between Improve and the adjacent cell."
    - "dea:pc-ao-build (adjacent context): agentive flow between Improve and the adjacent cell."
    - "dea:pc-ao-operate (adjacent context): agentive flow between Improve and the adjacent cell."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

