# Process Context Cell Charter: StrategyAndDirection x Design.
#
# Lands as part of CR-BP-21a (StrategyAndDirection landing, first
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.2
# (Strategy & Direction: design of strategic choices, alternatives, objectives, scenarios).

id: dea:pc-sd-design
domain: StrategyAndDirection
lifecycle_stage: Design
name: Strategic Choices Design

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **designing** the strategic choices, alternatives, objectives, and scenarios of the enterprise in the **Strategy & Direction** domain. This context addresses the analytical work of producing designs for strategic options, evaluating alternatives, defining objectives and targets, and framing scenarios. v2.4.0: design mechanics that translate conceived strategic intent into candidate options and choices.

# Scope (PC-005).
scope:
  includes:
    - Strategic option design
    - Strategic alternative evaluation
    - Objectives and targets design
    - Strategic scenario design
  excludes:
    - Strategic intent conception (Conceive stage; adjacent context)
    - Strategic plan and roadmap build (Build stage; adjacent context)
    - Operational planning (operations-enablement x design)
    - Financial plan design (finance-accounting x design)

# Intended outcomes.
outcomes:
    - Strategic options are designed with bounded trade-offs.
    - Strategic alternatives are evaluated against stated criteria.
    - Objectives and targets are designed and committed.
    - Strategic scenarios are framed for resilience assessment.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-sd-conceive
    - dea:pc-sd-build
    - dea:pc-sd-operate
    - dea:pc-sd-improve

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-design-strategic-options

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Strategy & Direction: the design of strategic choices and trade-offs."
  lifecycle_concern: "Design: designing options, evaluating alternatives, defining objectives and scenarios."
  combined_semantic_meaning: |
    The analytical work of producing designs for strategic options, alternatives, objectives, and scenarios from the conceived intent.
  expected_outcomes:
