# Process Context Cell Charter: GovernanceAndExistence x Build.
#
# Lands as part of CR-BP-13a (CustomerAndDemand admission tranche).
# This is the N-th Process Context cell in the catalog; the first
# was dea:pc-cd-op (CustomerAndDemand x Operate; CR-BP-03C).
#
# Each cell carries the full Cell Charter (CR-BP-02 §7):
#   enterprise_concern, lifecycle_concern, combined_semantic_meaning,
#   inclusions / exclusions, adjacent_boundaries.

id: dea:pc-ge-b
domain: GovernanceAndExistence
lifecycle_stage: Build
name: Governance Body Establishment

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **building** the governance bodies, charters, and policy artefacts in the **governance and existence** domain. This context addresses the work of standing up the operational artefacts that constitute governance: boards, committees, charters, codified policies, and standards.

# Scope (PC-005).
scope:
  includes:
    - Board and committee establishment
    - Charter codification
    - Policy artefact construction
    - Standard and procedure documentation
  excludes:
    - Strategy framing (Conceive stage)
    - Governance system design (Design stage)
    - Governance operation (Operate stage)

# Intended outcomes.
outcomes:
  - Governance bodies are established and operational.
  - Charters are codified.
  - Policy artefacts are operational.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
  - dea:pc-ge-c
  - dea:pc-ge-d
  - dea:pc-ge-op
  - dea:pc-ge-im

# Business Processes belonging to this context (PC-008).
processes:
  - dea:process-establish-governance-bodies
  - dea:process-codify-charters-and-policies

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Governance and existence: the enterprise's mandate, policy posture, and charter direction."
  lifecycle_concern: "Build: standing up the governance bodies, charters, and policy artefacts."
  combined_semantic_meaning: |
    Standing up the operational artefacts that constitute governance: boards, committees, charters, codified policies, and standards.
  expected_outcomes:
    - Governance bodies are established and operational.
    - Charters are codified.
    - Policy artefacts are operational.
  inclusions:
    - Board and committee establishment
    - Charter codification
    - Policy artefact construction
  exclusions:
    - Strategy framing (Conceive stage)
    - Governance system design (Design stage)
    - Governance operation (Operate stage)
  adjacent_boundaries:
    - "dea:pc-ge-c (Conceive): strategy is the build's input."
    - "dea:pc-ge-d (Design): governance system designs guide the build."
    - "dea:pc-ge-op (Operate): built bodies and charters operate."
    - "dea:pc-ge-im (Improve): built bodies and charters are reviewed."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

# Provenance.
