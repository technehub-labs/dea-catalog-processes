# Process Context Cell Charter: StrategyAndDirection x Operate.
#
# Lands as part of CR-BP-21a (StrategyAndDirection landing, first
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.2
# (Strategy & Direction: monitoring, environmental sensing, and steering of strategic performance).

id: dea:pc-sd-operate
domain: StrategyAndDirection
lifecycle_stage: Operate
name: Strategic Steering Operation

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **operating** the strategic steering, environmental sensing, and strategic review cycle of the enterprise in the **Strategy & Direction** domain. This context addresses the steady-state work of monitoring strategic performance, sensing environmental signals, steering the initiative portfolio, and operating the strategic review cycle. v2.4.0: monitoring and steering the strategy as a stable subject; operational performance management lives in Enablement & Operations.

# Scope (PC-005).
scope:
  includes:
    - Strategic performance monitoring
    - Environmental sensing
    - Initiative portfolio steering
    - Strategic review cycle operation
  excludes:
    - Operational performance management (enablement-operations x operate)
    - Initiative execution (enablement-operations x operate)
    - Strategic adaptation (Improve stage; adjacent context)

# Intended outcomes.
outcomes:
    - Strategic performance is monitored against the plan.
    - Environmental signals are sensed and contextualised.
    - Initiative portfolio is steered in line with strategic intent.
    - Strategic review cycle is operated on a defined cadence.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-sd-conceive
    - dea:pc-sd-design
    - dea:pc-sd-build
    - dea:pc-sd-improve

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-monitor-strategic-performance
    - dea:process-sense-environmental-signals
    - dea:process-steer-initiative-portfolio
    - dea:process-operate-strategic-review-cycle

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Strategy & Direction: the steady-state steering of strategic performance."
  lifecycle_concern: "Operate: monitoring strategic performance and operating the review cycle."
  combined_semantic_meaning: |
    The steady-state work of monitoring strategic performance, sensing environmental signals, and steering the initiative portfolio in line with the plan.
  expected_outcomes:
    - Strategic performance is monitored against the plan.
    - Environmental signals are sensed and contextualised.
    - Initiative portfolio is steered in line with strategic intent.
    - Strategic review cycle is operated on a defined cadence.
  inclusions:
    - Strategic performance monitoring
    - Environmental sensing
    - Initiative portfolio steering
    - Strategic review cycle operation
  exclusions:
    - Operational performance management (enablement-operations x operate)
    - Initiative execution (enablement-operations x operate)
    - Strategic adaptation (Improve stage; adjacent context)
  adjacent_boundaries:
    - "dea:pc-sd-conceive (adjacent context): strategy flows between Operate and the adjacent cell."
    - "dea:pc-sd-design (adjacent context): strategy flows between Operate and the adjacent cell."
    - "dea:pc-sd-build (adjacent context): strategy flows between Operate and the adjacent cell."
    - "dea:pc-sd-improve (adjacent context): strategy flows between Operate and the adjacent cell."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

