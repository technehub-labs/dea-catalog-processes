# Process Context Cell Charter: EnablementAndOperations x Operate.
#
# Lands as part of CR-BP-21d (EnablementAndOperations landing, fourth
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.6
# (Enablement & Operations: operation of production, delivery, logistics, technology platforms, facilities, and procurement).
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-oe-operate
domain: EnablementAndOperations
lifecycle_stage: Operate
name: Execution, Technology, and Asset Operation

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **operating** the production lines, service delivery, logistics, warehouse and inventory, quality control, technology platforms, facilities, asset maintenance, and procurement cycle of the enterprise in the **Enablement & Operations** domain. This context addresses the steady-state work of running the execution engine. v2.4.0: absorbs procurement execution, facility operation, and asset maintenance from the dissolved Supply & Resources domain; supplier performance relationships live in party-relationship (domain-grounding.md §3.6).

# Scope (PC-005).
scope:
  includes:
    - Production line operation
    - Service delivery operation
    - Logistics operation
    - Warehouse and inventory operation
    - Technology platform operation
    - Facility and asset maintenance operation
    - Procurement cycle execution
  excludes:
    - Operations build (Build stage; adjacent context)
    - Supplier relationship management (party-relationship x operate; adjacent domain)
    - Customer relationship operation (party-relationship x operate; adjacent domain)
    - Product catalogue operation (product-value x operate; adjacent domain)
    - Agent performance operation (agency-organization x operate; adjacent domain)

# Intended outcomes.
outcomes:
    - Production lines are run to plan.
    - Service delivery is operated against committed levels.
    - Logistics, warehouse, and inventory are operated.
    - Technology platforms are operated and available.
    - Facilities and assets are maintained.
    - Procurement cycle is executed.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-oe-conceive
    - dea:pc-oe-design
    - dea:pc-oe-build
    - dea:pc-oe-improve

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-operate-service-delivery
    - dea:process-run-production-line
    - dea:process-operate-logistics
    - dea:process-operate-warehouse-and-inventory
    - dea:process-operate-quality-control
    - dea:process-operate-technology-platforms
    - dea:process-operate-facility-management
    - dea:process-operate-asset-maintenance
    - dea:process-operate-procurement-cycle

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Enablement & Operations: the steady-state operation of the enterprise's execution engine."
  lifecycle_concern: "Operate: operating production, service delivery, logistics, technology platforms, facilities, assets, and the procurement cycle."
  combined_semantic_meaning: |
    The steady-state work of operating production lines, service delivery, logistics, warehouse and inventory, quality control, technology platforms, facilities, asset maintenance, and the procurement cycle.
  expected_outcomes:
    - Production lines are run to plan.
    - Service delivery is operated against committed levels.
    - Logistics, warehouse, and inventory are operated.
    - Technology platforms are operated and available.
    - Facilities and assets are maintained.
    - Procurement cycle is executed.
  inclusions:
    - Production line operation
    - Service delivery operation
    - Logistics operation
    - Warehouse and inventory operation
    - Technology platform operation
    - Facility and asset maintenance operation
    - Procurement cycle execution
  exclusions:
    - Operations build (Build stage; adjacent context)
    - Supplier relationship management (party-relationship x operate; adjacent domain)
    - Customer relationship operation (party-relationship x operate; adjacent domain)
    - Product catalogue operation (product-value x operate; adjacent domain)
    - Agent performance operation (agency-organization x operate; adjacent domain)
  adjacent_boundaries:
    - "dea:pc-oe-conceive (adjacent context): execution flow between Operate and the adjacent cell."
    - "dea:pc-oe-design (adjacent context): execution flow between Operate and the adjacent cell."
    - "dea:pc-oe-build (adjacent context): execution flow between Operate and the adjacent cell."
    - "dea:pc-oe-improve (adjacent context): execution flow between Operate and the adjacent cell."

