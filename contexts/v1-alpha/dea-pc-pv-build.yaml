# Process Context Cell Charter: ProductAndValue x Build.
#
# Lands as part of CR-BP-21c (ProductAndValue landing, third
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.5
# (Product & Value: development of product variants, service capability, prototypes, and market readiness).
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-pv-build
domain: ProductAndValue
lifecycle_stage: Build
name: Product Development and Market Readiness Build

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **building** the products, prototypes, and market readiness of the enterprise in the **Product & Value** domain. This context addresses the constructive work of developing product variants, building service capability, building innovation prototypes, and preparing market readiness. v2.4.0: technology build is Enablement & Operations; this cell covers the proposition-side construction (domain-grounding.md §3.5).

# Scope (PC-005).
scope:
  includes:
    - Product variant development
    - Service capability build
    - Innovation prototype build
    - Market readiness preparation
  excludes:
    - Proposition design (Design stage; adjacent context)
    - Technology platform build (enablement-operations x build; adjacent domain)
    - Operational delivery build (enablement-operations x build; adjacent domain)

# Intended outcomes.
outcomes:
    - Product variants are developed and ready for market.
    - Service capability is built and ready for operation.
    - Innovation prototypes are built and validated.
    - Market readiness is prepared for the Operate cell.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-pv-conceive
    - dea:pc-pv-design
    - dea:pc-pv-operate
    - dea:pc-pv-improve

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-develop-product-variants
    - dea:process-build-service-capability
    - dea:process-build-innovation-prototype
    - dea:process-prepare-market-readiness

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Product & Value: the construction of the enterprise's products and market readiness."
  lifecycle_concern: "Build: developing product variants, building service capability, building prototypes, and preparing market readiness."
  combined_semantic_meaning: |
    The constructive work of developing product variants, building service capability, building innovation prototypes, and preparing market readiness.
  expected_outcomes:
    - Product variants are developed and ready for market.
    - Service capability is built and ready for operation.
    - Innovation prototypes are built and validated.
    - Market readiness is prepared for the Operate cell.
  inclusions:
    - Product variant development
    - Service capability build
    - Innovation prototype build
    - Market readiness preparation
  exclusions:
    - Proposition design (Design stage; adjacent context)
    - Technology platform build (enablement-operations x build; adjacent domain)
    - Operational delivery build (enablement-operations x build; adjacent domain)
  adjacent_boundaries:
    - "dea:pc-pv-conceive (adjacent context): proposition flow between Build and the adjacent cell."
    - "dea:pc-pv-design (adjacent context): proposition flow between Build and the adjacent cell."
    - "dea:pc-pv-operate (adjacent context): proposition flow between Build and the adjacent cell."
    - "dea:pc-pv-improve (adjacent context): proposition flow between Build and the adjacent cell."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

