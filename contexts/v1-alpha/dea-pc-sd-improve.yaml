# Process Context Cell Charter: StrategyAndDirection x Improve.
#
# Lands as part of CR-BP-21a (StrategyAndDirection landing, first
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.2
# (Strategy & Direction: adaptation, objectives refresh, and effectiveness review).

id: dea:pc-sd-improve
domain: StrategyAndDirection
lifecycle_stage: Improve
name: Strategic Adaptation

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **adapting** the strategic direction, objectives, and effectiveness of the enterprise in the **Strategy & Direction** domain. This context addresses the learning and adaptation work of refreshing objectives, adapting strategic direction, and reviewing strategy effectiveness. v2.4.0: adaptation and refresh as a stable subject; capability improvement remains in the owning domain.

# Scope (PC-005).
scope:
  includes:
    - Strategic direction adaptation
    - Objectives and targets refresh
    - Strategy effectiveness review
  excludes:
    - Strategic performance monitoring (Operate stage; adjacent context)
    - Capability improvement (owning domains)

# Intended outcomes.
outcomes:
    - Strategic direction is adapted to changing context.
    - Objectives and targets are refreshed as needed.
    - Strategy effectiveness is reviewed and learned from.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-sd-conceive
    - dea:pc-sd-design
    - dea:pc-sd-build
    - dea:pc-sd-operate

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-adapt-strategic-direction
    - dea:process-refresh-objectives-and-targets
    - dea:process-review-strategy-effectiveness

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Strategy & Direction: the adaptation and refresh of strategic direction."
  lifecycle_concern: "Improve: adapting strategic direction and refreshing objectives and targets."
  combined_semantic_meaning: |
    The learning and adaptation work of refreshing objectives, adapting strategic direction, and reviewing strategy effectiveness.
  expected_outcomes:
    - Strategic direction is adapted to changing context.
    - Objectives and targets are refreshed as needed.
    - Strategy effectiveness is reviewed and learned from.
  inclusions:
    - Strategic direction adaptation
    - Objectives and targets refresh
    - Strategy effectiveness review
  exclusions:
    - Strategic performance monitoring (Operate stage; adjacent context)
    - Capability improvement (owning domains)
  adjacent_boundaries:
    - "dea:pc-sd-conceive (adjacent context): strategy flows between Improve and the adjacent cell."
    - "dea:pc-sd-design (adjacent context): strategy flows between Improve and the adjacent cell."
    - "dea:pc-sd-build (adjacent context): strategy flows between Improve and the adjacent cell."
    - "dea:pc-sd-operate (adjacent context): strategy flows between Improve and the adjacent cell."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

