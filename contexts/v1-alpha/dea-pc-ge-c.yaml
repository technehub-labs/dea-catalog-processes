# Process Context Cell Charter: GovernanceAndExistence x Conceive.
#
# Lands as part of CR-BP-13a (CustomerAndDemand admission tranche).
# This is the N-th Process Context cell in the catalog; the first
# was dea:pc-cd-op (CustomerAndDemand x Operate; CR-BP-03C).
#
# Each cell carries the full Cell Charter (CR-BP-02 §7):
#   enterprise_concern, lifecycle_concern, combined_semantic_meaning,
#   inclusions / exclusions, adjacent_boundaries.

id: dea:pc-ge-c
domain: GovernanceAndExistence
lifecycle_stage: Conceive
name: Strategy and Governance Conception

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **conceiving** the strategy, mandate, and policy direction of the organization in the **governance and existence** domain. This context addresses the front-end work of framing the enterprise's governance strategy, policy posture, and charter direction: deciding what the organization exists to do, what policies govern its operation, and what charters define its authorities.

# Scope (PC-005).
scope:
  includes:
    - Governance strategy framing
    - Policy and mandate initiation
    - Charter direction
    - Board mandate conception
  excludes:
    - Governance system design (Design stage; adjacent context)
    - Governance body establishment (Build stage; adjacent context)
    - Governance oversight (Operate stage; adjacent context)

# Intended outcomes.
outcomes:
  - Governance strategy is framed with a defensible mandate.
  - Policy and charter direction is committed.
  - Board mandate is articulated.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
  - dea:pc-ge-d
  - dea:pc-ge-b
  - dea:pc-ge-op
  - dea:pc-ge-im

# Business Processes belonging to this context (PC-008).
processes:
  - dea:process-develop-governance-strategy
  - dea:process-initiate-policy-and-charter

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Governance and existence: the enterprise's mandate, policy posture, and charter direction."
  lifecycle_concern: "Conceive: framing governance strategy, mandate, and policy direction."
  combined_semantic_meaning: |
    The front-end work of framing what the organization exists to do, what policies govern its operation, and what charters define its authorities.
  expected_outcomes:
    - Governance strategy is framed with a defensible mandate.
    - Policy and charter direction is committed.
    - Board mandate is articulated.
  inclusions:
    - Governance strategy framing
    - Policy and mandate initiation
    - Charter direction
  exclusions:
    - Governance system design (Design stage)
    - Governance body establishment (Build stage)
    - Governance oversight (Operate stage)
  adjacent_boundaries:
    - "dea:pc-ge-d (Design): strategy flows into governance system design."
    - "dea:pc-ge-b (Build): designs flow into body and charter construction."
    - "dea:pc-ge-op (Operate): framed strategy is realised in board and committee operations."
    - "dea:pc-ge-im (Improve): framed strategy is reviewed and refreshed."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

