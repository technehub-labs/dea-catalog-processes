# Process Context Cell Charter: AgencyAndOrganization x Build.
#
# Lands as part of CR-BP-21b (AgencyAndOrganization landing, second
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.3
# (Agency & Organization: acquisition, provisioning, and onboarding of agents).
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-ao-build
domain: AgencyAndOrganization
lifecycle_stage: Build
name: Agent Acquisition and Onboarding

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **acquiring and onboarding** the agents of the enterprise in the **Agency & Organization** domain. This context addresses the constructive work of sourcing and provisioning agents, onboarding and integrating them, and building the contractor and partner-agent pool. v2.4.0: substrate-neutral — acquisition covers recruitment (biological), model deployment and API integration (artificial), and hybrid provisioning.

# Scope (PC-005).
scope:
  includes:
    - Agent acquisition
    - Agent onboarding and integration
    - Contractor and partner-agent pool build
    - Agent provisioning configuration
  excludes:
    - Organization structure design (Design stage; adjacent context)
    - External party engagement (party-relationship x build; adjacent domain)
    - Operational execution (enablement-operations x build; adjacent domain)

# Intended outcomes.
outcomes:
    - Agents are acquired for the enterprise.
    - Agents are onboarded and integrated into the organization.
    - Contractor and partner-agent pool is built and ready.
    - Agent provisioning configurations are committed.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-ao-conceive
    - dea:pc-ao-design
    - dea:pc-ao-operate
    - dea:pc-ao-improve

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-acquire-and-onboard-agents
    - dea:process-build-contractor-and-partner-agent-pool

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Agency & Organization: the acquisition and provisioning of the enterprise's agents."
  lifecycle_concern: "Build: acquiring, provisioning, and integrating agents into the organization."
  combined_semantic_meaning: |
    The constructive work of sourcing, provisioning, onboarding, and integrating agents (biological, artificial, and hybrid).
  expected_outcomes:
    - Agents are acquired for the enterprise.
    - Agents are onboarded and integrated into the organization.
    - Contractor and partner-agent pool is built and ready.
    - Agent provisioning configurations are committed.
  inclusions:
    - Agent acquisition
    - Agent onboarding and integration
    - Contractor and partner-agent pool build
    - Agent provisioning configuration
  exclusions:
    - Organization structure design (Design stage; adjacent context)
    - External party engagement (party-relationship x build; adjacent domain)
    - Operational execution (enablement-operations x build; adjacent domain)
  adjacent_boundaries:
    - "dea:pc-ao-conceive (adjacent context): agentive flow between Build and the adjacent cell."
    - "dea:pc-ao-design (adjacent context): agentive flow between Build and the adjacent cell."
    - "dea:pc-ao-operate (adjacent context): agentive flow between Build and the adjacent cell."
    - "dea:pc-ao-improve (adjacent context): agentive flow between Build and the adjacent cell."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

# Provenance.
established_by: CR-BP-21b
established_at: '2026-09-07'

