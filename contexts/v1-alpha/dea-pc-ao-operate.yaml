# Process Context Cell Charter: AgencyAndOrganization x Operate.
#
# Lands as part of CR-BP-21b (AgencyAndOrganization landing, second
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.3
# (Agency & Organization: operation of agent performance, collaboration, and lifecycle).
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-ao-operate
domain: AgencyAndOrganization
lifecycle_stage: Operate
name: Agent Operations and Performance

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **operating** the agent performance, collaboration, and lifecycle operations of the enterprise in the **Agency & Organization** domain. This context addresses the steady-state work of operating agent performance, coordination and collaboration, time and attendance, and learning and development operations. v2.4.0: substrate-neutral — applies to biological, artificial, and hybrid agents without reclassification.

# Scope (PC-005).
scope:
  includes:
    - Agent performance operation
    - Coordination and collaboration operation
    - Time and attendance operation
    - Compensation operation
    - Learning and development operation
  excludes:
    - Agent acquisition (Build stage; adjacent context)
    - Agent development (Improve stage; adjacent context)
    - Operational execution (operations-enablement x operate; adjacent domain)
    - Compensation accounting (finance-accounting x operate; adjacent domain)

# Intended outcomes.
outcomes:
    - Agent performance is operated across the agentive mix.
    - Coordination and collaboration are operated substrate-neutrally.
    - Time and attendance are operated across the agentive mix.
    - Compensation is operated against the workforce policy.
    - Learning and development are operated across the agentive mix.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-ao-conceive
    - dea:pc-ao-design
    - dea:pc-ao-build
    - dea:pc-ao-improve

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-operate-agent-performance
    - dea:process-operate-payroll-and-benefits
    - dea:process-operate-time-and-attendance
    - dea:process-operate-learning-and-development
    - dea:process-coordinate-collaboration

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Agency & Organization: the steady-state operation of the enterprise's agent performance."
  lifecycle_concern: "Operate: operating agent performance, collaboration, time and attendance, compensation, and learning."
  combined_semantic_meaning: |
    The steady-state work of operating agent performance, coordination, and lifecycle across biological, artificial, and hybrid agents.
  expected_outcomes:
    - Agent performance is operated across the agentive mix.
    - Coordination and collaboration are operated substrate-neutrally.
    - Time and attendance are operated across the agentive mix.
    - Compensation is operated against the workforce policy.
    - Learning and development are operated across the agentive mix.
  inclusions:
    - Agent performance operation
    - Coordination and collaboration operation
    - Time and attendance operation
    - Compensation operation
    - Learning and development operation
  exclusions:
    - Agent acquisition (Build stage; adjacent context)
    - Agent development (Improve stage; adjacent context)
    - Operational execution (operations-enablement x operate; adjacent domain)
    - Compensation accounting (finance-accounting x operate; adjacent domain)
  adjacent_boundaries:
    - "dea:pc-ao-conceive (adjacent context): agentive flow between Operate and the adjacent cell."
    - "dea:pc-ao-design (adjacent context): agentive flow between Operate and the adjacent cell."
    - "dea:pc-ao-build (adjacent context): agentive flow between Operate and the adjacent cell."
    - "dea:pc-ao-improve (adjacent context): agentive flow between Operate and the adjacent cell."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

