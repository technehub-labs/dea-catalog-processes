# Process Context Cell Charter: CustomerAndDemand x Improve.
#
# Lands as part of CR-BP-13a (CustomerAndDemand admission tranche).
# This is the N-th Process Context cell in the catalog; the first
# was dea:pc-cd-op (CustomerAndDemand x Operate; CR-BP-03C).
#
# Each cell carries the full Cell Charter (CR-BP-02 §7):
#   enterprise_concern, lifecycle_concern, combined_semantic_meaning,
#   inclusions / exclusions, adjacent_boundaries.

id: dea:pc-cd-im
domain: CustomerAndDemand
lifecycle_stage: Improve
name: Customer Insight and Retention

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **improving** customer experience, retention, and lifetime value in the **customer and demand** domain. This context addresses the work of monitoring customer insight (satisfaction, churn risk, win-back opportunities) and operating retention programs that close the loop between insight and design/build/operate.

# Scope (PC-005).
scope:
  includes:
    - Customer satisfaction monitoring
    - Churn analysis and prediction
    - Win-back program operation
    - Customer feedback loops
  excludes:
    - Active customer relationship operation (Operate stage)
    - Customer strategy framing (Conceive stage)
    - Customer experience design (Design stage)

# Intended outcomes.
outcomes:
  - Customer insight informs Conceive/Design/Build cycles.
  - Retention programs reduce churn.
  - Win-back programs re-engage lapsed customers.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
  - dea:pc-cd-c
  - dea:pc-cd-d
  - dea:pc-cd-b
  - dea:pc-cd-op

# Business Processes belonging to this context (PC-008).
processes:
  - dea:process-customer-insight-and-retention

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Customer and demand: the enterprise's exchange with its customer base."
  lifecycle_concern: "Improve: closing the loop between insight and conceive/design/build/operate cycles."
  combined_semantic_meaning: |
    Monitoring customer insight (satisfaction, churn, win-back) and operating retention programs that translate insight into action across the customer value stream.
  expected_outcomes:
    - Customer insight feeds Conceive/Design/Build/Operate.
    - Retention programs reduce churn.
    - Win-back programs re-engage lapsed customers.
  inclusions:
    - Customer satisfaction monitoring
    - Churn analysis and prediction
    - Win-back program operation
  exclusions:
    - Active customer relationship operation (Operate stage)
    - Customer strategy framing (Conceive stage)
    - Customer experience design (Design stage)
  adjacent_boundaries:
    - "dea:pc-cd-c (Conceive): insights shape strategy framing."
    - "dea:pc-cd-d (Design): insights sharpen experience design."
    - "dea:pc-cd-b (Build): insights reveal channel gaps."
    - "dea:pc-cd-op (Operate): insights refine day-to-day relationship operation."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

