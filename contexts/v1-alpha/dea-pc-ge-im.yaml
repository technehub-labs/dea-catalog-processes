# Process Context Cell Charter: GovernanceAndExistence x Improve.
#
# Lands as part of CR-BP-13a (CustomerAndDemand admission tranche).
# This is the N-th Process Context cell in the catalog; the first
# was dea:pc-cd-op (CustomerAndDemand x Operate; CR-BP-03C).
#
# Each cell carries the full Cell Charter (CR-BP-02 §7):
#   enterprise_concern, lifecycle_concern, combined_semantic_meaning,
#   inclusions / exclusions, adjacent_boundaries.

id: dea:pc-ge-im
domain: GovernanceAndExistence
lifecycle_stage: Improve
name: Governance Review and Learning

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **improving** the governance bodies, policy regimes, and oversight machinery in the **governance and existence** domain. This context addresses the work of reviewing governance effectiveness, scoring audit findings, and feeding the lessons back into Conceive/Design/Build/Operate cycles.

# Scope (PC-005).
scope:
  includes:
    - Governance effectiveness review
    - Audit finding scoring
    - Policy regime refinement
    - Lessons-learned propagation
  excludes:
    - Governance operation (Operate stage)
    - Strategy framing (Conceive stage)
    - Governance system design (Design stage)

# Intended outcomes.
outcomes:
  - Governance effectiveness is measured.
  - Audit findings drive improvement.
  - Lessons learned feed back into Conceive/Design cycles.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
  - dea:pc-ge-c
  - dea:pc-ge-d
  - dea:pc-ge-b
  - dea:pc-ge-op

# Business Processes belonging to this context (PC-008).
processes:
  - dea:process-review-governance-effectiveness

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Governance and existence: the enterprise's mandate, policy posture, and charter direction."
  lifecycle_concern: "Improve: closing the loop between governance insight and conceive/design/build/operate cycles."
  combined_semantic_meaning: |
    Reviewing governance effectiveness, scoring audit findings, and feeding lessons back into Conceive/Design/Build/Operate cycles.
  expected_outcomes:
    - Governance effectiveness is measured.
    - Audit findings drive improvement.
    - Lessons learned feed back into Conceive/Design cycles.
  inclusions:
    - Governance effectiveness review
    - Audit finding scoring
    - Policy regime refinement
  exclusions:
    - Governance operation (Operate stage)
    - Strategy framing (Conceive stage)
    - Governance system design (Design stage)
  adjacent_boundaries:
    - "dea:pc-ge-c (Conceive): insights shape strategy framing."
    - "dea:pc-ge-d (Design): insights sharpen governance design."
    - "dea:pc-ge-b (Build): insights reveal body and charter gaps."
    - "dea:pc-ge-op (Operate): insights refine day-to-day governance operation."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

