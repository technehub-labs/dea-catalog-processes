# Process Context Cell Charter: PartyAndRelationship x Operate.
#
# This is the FIRST Process Context entry in the catalog,
# landing as part of CR-BP-03C. It exercises the CR-BP-02
# Cell Charter machinery and provides the bounded enterprise
# context for dea:process-manage-customer-relationship.
#
# Cell Charter (CR-BP-02 §7):
#   - enterprise_concern: The bounded enterprise concern
#     addressed by this intersection.
#   - lifecycle_concern: The bounded lifecycle concern.
#   - combined_semantic_meaning: The semantic confluence
#     of the two.
#   - expected_outcomes: The intended outcomes.
#   - inclusions / exclusions: The discovery scope.
#   - adjacent_boundaries: How this context relates to
#     adjacent cells.

id: dea:pc-pr-op
domain: PartyAndRelationship
lifecycle_stage: Operate
name: Customer Relationship Operations

# Normative definition (not a description; PC-006).
definition: |
  The bounded enterprise context for the **operation** of
  customer relationships in the **customer and demand**
  domain. This context addresses the day-to-day management
  of active customer relationships — the work of
  allocating attention, handling escalations, and
  coordinating renewal or win-back activities.

# Scope (PC-005).
scope:
  includes:
    - Active customer relationship management
    - Customer escalation handling
    - Customer renewal coordination
    - Customer win-back activities
    - Customer portfolio allocation
  excludes:
    - New customer acquisition (Conceive stage)
    - Customer onboarding implementation (Build stage)
    - Customer support tickets (Support Staff BP, not L2)

# Intended outcomes.
outcomes:
  - Active customer relationships are sustained across their lifecycle.
  - Customer escalations are resolved within agreed service-level targets.
  - Customer renewals are coordinated with minimal revenue leakage.
  - Customer portfolio allocation is data-informed.

# Adjacent contexts (dea:pc-...). Relationships do NOT imply
# duplicated ownership (CR-BP-02 §11).
adjacent_contexts:
  - dea:pc-pr-c
  - dea:pc-pr-d
  - dea:pc-pr-b
  - dea:pc-pr-ac

# Business Processes belonging to this context (PC-008).
# Must resolve to canonical BP specialization ids.
processes:
  - dea:process-manage-customer-relationship

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: Customer and demand — the enterprise's exchange with its customer base.
  lifecycle_concern: Operate — the ongoing operation of an active relationship.
  combined_semantic_meaning: |
    The day-to-day operation of an active customer
    relationship: ongoing management, escalation handling,
    renewal coordination, and portfolio allocation.
  expected_outcomes:
    - Active customer relationships are sustained.
    - Customer escalations are resolved within service-level targets.
    - Customer renewals are coordinated with minimal leakage.
    - Portfolio allocation is data-informed.
  inclusions:
    - Account management
    - Escalation handling
    - Renewal coordination
    - Win-back coordination
  exclusions:
    - New customer acquisition (Conceive)
    - Onboarding implementation (Build)
    - Customer support tickets (Support Staff BP)
  adjacent_boundaries:
    - "dea:pc-pr-c (Conceive): the prior lifecycle stage; transition from new customer to active customer."
    - "dea:pc-pr-d (Design): the design context; may inform renewal design."
    - "dea:pc-pr-b (Build): the build context; may inform onboarding handoff to Operate."
    - "dea:pc-pr-ac (Activate): the activate context; transition into active operation."

# Lifecycle status (CR-BP-02 §17).
status: defined

# Metadata (CR-BP-02 §17; not part of the schema's required fields).
metadata:
  established_by: CR-BP-03C
  established_at: '2026-09-03'
  change_history:
    - cr: CR-BP-03C
      date: '2026-09-03'
      change: |
        Initial cell charter as part of the CR-BP-03C
        sample contribution. Exercises the CR-BP-02 Cell
        Charter machinery and provides the bounded
        enterprise context for
        dea:process-manage-customer-relationship.
