# Process Context Cell Charter: StrategyAndDirection x Build.
#
# Lands as part of CR-BP-21a (StrategyAndDirection landing, first
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.2
# (Strategy & Direction: construction of the strategic plan, roadmap, and initiative portfolio).

id: dea:pc-sd-build
domain: StrategyAndDirection
lifecycle_stage: Build
name: Strategic Plan Build

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **building** the strategic plan, roadmap, and initiative portfolio of the enterprise in the **Strategy & Direction** domain. This context addresses the constructive work of translating designed strategic choices into a plan, building a roadmap, translating choices into initiatives, and setting resource allocation priorities. v2.4.0: the plan artefact construction; capability build remains in the receiving domain.

# Scope (PC-005).
scope:
  includes:
    - Strategic plan build
    - Strategic roadmap build
    - Strategic choice-to-initiative translation
    - Resource allocation priority setting
  excludes:
    - Strategic option design (Design stage; adjacent context)
    - Budget construction (finance-accounting x build)
    - Capability build (owning domains)

# Intended outcomes.
outcomes:
    - Strategic plan is built and versioned.
    - Strategic roadmap is built and committed.
    - Strategic choices are translated into an initiative portfolio.
    - Resource allocation priorities are set within the authorised frame.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-sd-design
    - dea:pc-sd-operate
    - dea:pc-sd-improve
    - dea:pc-sd-conceive

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-build-strategic-plan
    - dea:process-build-strategic-roadmap
    - dea:process-translate-strategic-choices-into-initiatives
    - dea:process-set-resource-allocation-priorities

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Strategy & Direction: the construction of the strategic plan and roadmap."
  lifecycle_concern: "Build: translating strategic choices into a plan, roadmap, and initiative portfolio."
  combined_semantic_meaning: |
    The constructive work of translating designed strategic choices into a versioned plan, roadmap, and initiative portfolio.
  expected_outcomes:
    - Strategic plan is built and versioned.
    - Strategic roadmap is built and committed.
    - Strategic choices are translated into an initiative portfolio.
    - Resource allocation priorities are set within the authorised frame.
  inclusions:
    - Strategic plan build
    - Strategic roadmap build
    - Strategic choice-to-initiative translation
    - Resource allocation priority setting
  exclusions:
    - Strategic option design (Design stage; adjacent context)
    - Budget construction (finance-accounting x build)
    - Capability build (owning domains)
  adjacent_boundaries:
    - "dea:pc-sd-design (adjacent context): strategy flows between Build and the adjacent cell."
    - "dea:pc-sd-operate (adjacent context): strategy flows between Build and the adjacent cell."
    - "dea:pc-sd-improve (adjacent context): strategy flows between Build and the adjacent cell."
    - "dea:pc-sd-conceive (adjacent context): strategy flows between Build and the adjacent cell."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

