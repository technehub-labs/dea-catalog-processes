# Process Context Cell Charter: ProductAndValue x Conceive.
#
# Lands as part of CR-BP-21c (ProductAndValue landing, third
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.5
# (Product & Value: conception of value propositions, portfolio direction, and innovation theses).
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-pv-conceive
domain: ProductAndValue
lifecycle_stage: Conceive
name: Proposition and Portfolio Conception

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **conceiving** the enterprise's value-bearing propositions in the **Product & Value** domain. This context addresses the front-end work of framing value proposition theses, framing portfolio direction, and framing innovation theses. v2.4.0: the domain manages the complete lifecycle of whatever the enterprise creates, shapes, packages, and makes available for exchange with external parties; 'Offering' was dropped as vague (domain-grounding.md §3.5).

# Scope (PC-005).
scope:
  includes:
    - Value proposition thesis framing
    - Portfolio direction framing
    - Innovation thesis framing
    - Proposition concept validation
  excludes:
    - Strategic portfolio investment decisions (strategy-direction x conceive; adjacent domain)
    - Capability strategy (governance-existence x conceive; adjacent domain)
    - Proposition design (Design stage; adjacent context)
    - Product development (Build stage; adjacent context)
    - Alliance and partnership thesis (party-relationship x conceive; adjacent domain)

# Intended outcomes.
outcomes:
    - Value proposition thesis is framed for the enterprise.
    - Portfolio direction is framed with bounded scope.
    - Innovation thesis is framed and validated.
    - Proposition concepts are validated against market evidence.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-pv-design
    - dea:pc-pv-build
    - dea:pc-pv-operate
    - dea:pc-pv-improve

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-frame-value-proposition-thesis

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Product & Value: the conception of the enterprise's value-bearing propositions."
  lifecycle_concern: "Conceive: framing value proposition theses, portfolio direction, and innovation theses."
  combined_semantic_meaning: |
    The front-end work of framing value proposition theses, portfolio direction, and innovation theses as the conception of value-bearing propositions.
  expected_outcomes:
    - Value proposition thesis is framed for the enterprise.
    - Portfolio direction is framed with bounded scope.
    - Innovation thesis is framed and validated.
    - Proposition concepts are validated against market evidence.
  inclusions:
    - Value proposition thesis framing
    - Portfolio direction framing
    - Innovation thesis framing
    - Proposition concept validation
  exclusions:
    - Strategic portfolio investment decisions (strategy-direction x conceive; adjacent domain)
    - Capability strategy (governance-existence x conceive; adjacent domain)
    - Proposition design (Design stage; adjacent context)
    - Product development (Build stage; adjacent context)
    - Alliance and partnership thesis (party-relationship x conceive; adjacent domain)
  adjacent_boundaries:
    - "dea:pc-pv-design (adjacent context): proposition flow between Conceive and the adjacent cell."
    - "dea:pc-pv-build (adjacent context): proposition flow between Conceive and the adjacent cell."
    - "dea:pc-pv-operate (adjacent context): proposition flow between Conceive and the adjacent cell."
    - "dea:pc-pv-improve (adjacent context): proposition flow between Conceive and the adjacent cell."

