# Process Context Cell Charter: GovernanceAndExistence x Design.
#
# Lands as part of CR-BP-13a (CustomerAndDemand admission tranche).
# This is the N-th Process Context cell in the catalog; the first
# was dea:pc-cd-op (CustomerAndDemand x Operate; CR-BP-03C).
#
# Each cell carries the full Cell Charter (CR-BP-02 §7):
#   enterprise_concern, lifecycle_concern, combined_semantic_meaning,
#   inclusions / exclusions, adjacent_boundaries.

id: dea:pc-ge-d
domain: GovernanceAndExistence
lifecycle_stage: Design
name: Governance System Design

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **designing** the governance system, control objectives, and policy architecture in the **governance and existence** domain. This context addresses the work of translating strategy and mandate into a designed governance architecture, a set of control objectives, and an articulated policy architecture that the enterprise can build.

# Scope (PC-005).
scope:
  includes:
    - Governance system architecture
    - Control objectives
    - Policy architecture
    - Authority delegation design
  excludes:
    - Strategy framing (Conceive stage)
    - Body and charter construction (Build stage)
    - Governance operation (Operate stage)

# Intended outcomes.
outcomes:
  - Governance system is designed and testable.
  - Control objectives are articulated.
  - Policy architecture is ready to be built.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
  - dea:pc-ge-c
  - dea:pc-ge-b
  - dea:pc-ge-op
  - dea:pc-ge-im

# Business Processes belonging to this context (PC-008).
processes:
  - dea:process-design-governance-system
  - dea:process-design-policies-and-controls

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Governance and existence: the enterprise's mandate, policy posture, and charter direction."
  lifecycle_concern: "Design: articulating how governance and policy will be structured and controlled."
  combined_semantic_meaning: |
    Translating strategy and mandate into a designed governance architecture, control objectives, and policy architecture.
  expected_outcomes:
    - Governance system is designed and testable.
    - Control objectives are articulated.
    - Policy architecture is ready to be built.
  inclusions:
    - Governance system architecture
    - Control objectives
    - Policy architecture
  exclusions:
    - Strategy framing (Conceive stage)
    - Body and charter construction (Build stage)
    - Governance operation (Operate stage)
  adjacent_boundaries:
    - "dea:pc-ge-c (Conceive): the prior lifecycle stage; strategy flows into design."
    - "dea:pc-ge-b (Build): designs flow into body and charter construction."
    - "dea:pc-ge-op (Operate): designed system is realised in board and committee operations."
    - "dea:pc-ge-im (Improve): designed system is reviewed and refreshed."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

# Provenance.
established_by: CR-BP-13a
established_at: '2026-09-05'

