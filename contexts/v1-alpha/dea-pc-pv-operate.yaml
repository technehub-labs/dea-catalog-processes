# Process Context Cell Charter: ProductAndValue x Operate.
#
# Lands as part of CR-BP-21c (ProductAndValue landing, third
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.5
# (Product & Value: operation of product catalogue, portfolio performance, and proposition lifecycle).
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-pv-operate
domain: ProductAndValue
lifecycle_stage: Operate
name: Portfolio Management and Proposition Lifecycle Operation

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **operating** the product catalogue, portfolio performance, and proposition lifecycle of the enterprise in the **Product & Value** domain. This context addresses the steady-state work of operating the product catalogue, managing portfolio performance, and managing the proposition lifecycle. v2.4.0: operational delivery of the product is Operations & Enablement; this cell covers the proposition-side operation (domain-grounding.md §3.5).

# Scope (PC-005).
scope:
  includes:
    - Product catalogue operation
    - Portfolio performance management
    - Proposition lifecycle management
    - Proposition performance monitoring
  excludes:
    - Product development (Build stage; adjacent context)
    - Operational delivery of the product (operations-enablement x operate; adjacent domain)
    - Partner alliance programme (party-relationship x operate; adjacent domain)
    - Workforce operation (agency-organization x operate; adjacent domain)

# Intended outcomes.
outcomes:
    - Product catalogue is operated across the portfolio.
    - Portfolio performance is managed against targets.
    - Proposition lifecycle is managed from launch to retirement.
    - Proposition performance is monitored and reported.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-pv-conceive
    - dea:pc-pv-design
    - dea:pc-pv-build
    - dea:pc-pv-improve

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-operate-product-catalogue
    - dea:process-manage-portfolio-performance
    - dea:process-manage-proposition-lifecycle

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Product & Value: the steady-state operation of the enterprise's product portfolio."
  lifecycle_concern: "Operate: operating product catalogue, portfolio performance, and proposition lifecycle."
  combined_semantic_meaning: |
    The steady-state work of operating the product catalogue, managing portfolio performance, and managing the proposition lifecycle.
  expected_outcomes:
    - Product catalogue is operated across the portfolio.
    - Portfolio performance is managed against targets.
    - Proposition lifecycle is managed from launch to retirement.
    - Proposition performance is monitored and reported.
  inclusions:
    - Product catalogue operation
    - Portfolio performance management
    - Proposition lifecycle management
    - Proposition performance monitoring
  exclusions:
    - Product development (Build stage; adjacent context)
    - Operational delivery of the product (operations-enablement x operate; adjacent domain)
    - Partner alliance programme (party-relationship x operate; adjacent domain)
    - Workforce operation (agency-organization x operate; adjacent domain)
  adjacent_boundaries:
    - "dea:pc-pv-conceive (adjacent context): proposition flow between Operate and the adjacent cell."
    - "dea:pc-pv-design (adjacent context): proposition flow between Operate and the adjacent cell."
    - "dea:pc-pv-build (adjacent context): proposition flow between Operate and the adjacent cell."
    - "dea:pc-pv-improve (adjacent context): proposition flow between Operate and the adjacent cell."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

