# Process Context Cell Charter: EnablementAndOperations x Build.
#
# Lands as part of CR-BP-21d (EnablementAndOperations landing, fourth
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.6
# (Enablement & Operations: build of production lines, delivery capability, logistics, technology assets, and facilities).
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-oe-build
domain: EnablementAndOperations
lifecycle_stage: Build
name: Operations and Enablement Build

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **building** the production lines, delivery capability, logistics network, technology assets, and facilities of the enterprise in the **Enablement & Operations** domain. This context addresses the constructive work of standing up the execution engine and provisioning its enabling assets. v2.4.0: absorbs asset acquisition and facility provisioning from the dissolved Supply & Resources domain; supplier onboarding lives in party-relationship x build (domain-grounding.md §3.6).

# Scope (PC-005).
scope:
  includes:
    - Production line stand-up
    - Delivery capability build
    - Logistics network build
    - Technology asset acquisition and installation
    - Facility acquisition and provisioning
  excludes:
    - Operations design (Design stage; adjacent context)
    - Agent provisioning (agency-organization x build; adjacent domain)
    - Supplier onboarding (party-relationship x build; adjacent domain)
    - Product variant development (product-value x build; adjacent domain)

# Intended outcomes.
outcomes:
    - Production lines are stood up and ready for operation.
    - Delivery capability is built and ready.
    - Logistics network is built and connected.
    - Technology assets are acquired and installed.
    - Facilities are acquired and provisioned.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-oe-conceive
    - dea:pc-oe-design
    - dea:pc-oe-operate
    - dea:pc-oe-improve

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-build-delivery-capability
    - dea:process-commission-production-line
    - dea:process-build-logistics-network
    - dea:process-acquire-technology-assets
    - dea:process-provision-facilities

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Enablement & Operations: the construction of the enterprise's execution engine and enabling assets."
  lifecycle_concern: "Build: standing up production lines, building delivery capability and logistics, and provisioning technology assets and facilities."
  combined_semantic_meaning: |
    The constructive work of standing up production lines, building delivery capability and the logistics network, and acquiring and provisioning technology assets and facilities.
  expected_outcomes:
    - Production lines are stood up and ready for operation.
    - Delivery capability is built and ready.
    - Logistics network is built and connected.
    - Technology assets are acquired and installed.
    - Facilities are acquired and provisioned.
  inclusions:
    - Production line stand-up
    - Delivery capability build
    - Logistics network build
    - Technology asset acquisition and installation
    - Facility acquisition and provisioning
  exclusions:
    - Operations design (Design stage; adjacent context)
    - Agent provisioning (agency-organization x build; adjacent domain)
    - Supplier onboarding (party-relationship x build; adjacent domain)
    - Product variant development (product-value x build; adjacent domain)
  adjacent_boundaries:
    - "dea:pc-oe-conceive (adjacent context): execution flow between Build and the adjacent cell."
    - "dea:pc-oe-design (adjacent context): execution flow between Build and the adjacent cell."
    - "dea:pc-oe-operate (adjacent context): execution flow between Build and the adjacent cell."
    - "dea:pc-oe-improve (adjacent context): execution flow between Build and the adjacent cell."

# Lifecycle status (CR-BP-02 §17).
lifecycle_status: candidate
status: candidate

