# Process Context Cell Charter: ProductAndValue x Improve.
#
# Lands as part of CR-BP-21c (ProductAndValue landing, third
# unadmitted-domain tranche under ECF v2.4.0 register v2 / CR-BP-19).
# Carries the full Cell Charter (CR-BP-02 §7).
#
# v2.4.0 grounding: dea-metaframework/framework/domain-grounding.md §3.5
# (Product & Value: improvement of propositions, products, and portfolio).
#
# Substrate independence (ADR-ECF-002 §5, CR-ECF-007): this context
# applies to biological, artificial, and hybrid agents without
# reclassification.

id: dea:pc-pv-improve
domain: ProductAndValue
lifecycle_stage: Improve
name: Product Evolution and Portfolio Rationalization

# Normative definition (PC-006).
definition: |
  The bounded enterprise context for **improving** the products and portfolio of the enterprise in the **Product & Value** domain. This context addresses the learning and adaptation work of conducting proposition performance reviews, evolving products and services, and rationalizing the portfolio. v2.4.0: capability improvement is the owning domain's concern; this cell covers proposition-side evolution (domain-grounding.md §3.5).

# Scope (PC-005).
scope:
  includes:
    - Proposition performance review
    - Product and service evolution
    - Portfolio rationalization
    - Proposition lifecycle optimization
  excludes:
    - Proposition performance operation (Operate stage; adjacent context)
    - Capability improvement (owning domains; adjacent domains)
    - Strategic adaptation (strategy-direction x improve; adjacent domain)

# Intended outcomes.
outcomes:
    - Proposition performance review is conducted and findings are committed.
    - Products and services are evolved based on performance evidence.
    - Portfolio is rationalized against strategic fit and performance.
    - Proposition lifecycle is optimized for the next planning cycle.

# Adjacent contexts (CR-BP-02 §11).
adjacent_contexts:
    - dea:pc-pv-conceive
    - dea:pc-pv-design
    - dea:pc-pv-build
    - dea:pc-pv-operate

# Business Processes belonging to this context (PC-008).
processes:
    - dea:process-conduct-proposition-performance-review

# Cell Charter (CR-BP-02 §7; PC-006).
cell_charter:
  enterprise_concern: "Product & Value: the improvement of the enterprise's products and portfolio."
  lifecycle_concern: "Improve: improving proposition performance, evolving products and services, and rationalizing the portfolio."
  combined_semantic_meaning: |
    The learning and adaptation work of conducting proposition performance reviews, evolving products and services, and rationalizing the portfolio.
  expected_outcomes:
    - Proposition performance review is conducted and findings are committed.
    - Products and services are evolved based on performance evidence.
    - Portfolio is rationalized against strategic fit and performance.
    - Proposition lifecycle is optimized for the next planning cycle.
  inclusions:
    - Proposition performance review
    - Product and service evolution
    - Portfolio rationalization
    - Proposition lifecycle optimization
  exclusions:
    - Proposition performance operation (Operate stage; adjacent context)
    - Capability improvement (owning domains; adjacent domains)
    - Strategic adaptation (strategy-direction x improve; adjacent domain)
  adjacent_boundaries:
    - "dea:pc-pv-conceive (adjacent context): proposition flow between Improve and the adjacent cell."
    - "dea:pc-pv-design (adjacent context): proposition flow between Improve and the adjacent cell."
    - "dea:pc-pv-build (adjacent context): proposition flow between Improve and the adjacent cell."
    - "dea:pc-pv-operate (adjacent context): proposition flow between Improve and the adjacent cell."

