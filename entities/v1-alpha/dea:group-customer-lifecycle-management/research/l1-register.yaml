- Operate
- Improve
- Retire
ratification:
  version: 1
  cr: CR-BP-13
  ratified_at: '2026-09-05'
  ratified_accepted: 38
  backlog_deferred: 11
  deferred_rationale: |
    Activate and Retire are lifecycle transition stages, not stable Process Group operating scopes. L1 Process Groups (CR-BP-12) catalogue the bounded operating scope of a process domain; the Activate stage is the handover from Build to Operate (a sub-step of the receiving Process Group), and the Retire stage is the wind-down of the prior Process Group (a sub-step of the ending Process Group). Neither forms a stable L1 group on its own. Reconsider if a discrete Activate/Retire process identity is later identified (separate CR).

register:
  GovernanceAndExistence:
    Conceive:
      process_context: dea:pc-ge-conceive
      l1_candidates:
      - Strategy and Governance Conception
      - Policy and Charter Initiation
      l2_candidates:
      - Develop corporate strategy
      - Frame governance policy
      - Initiate charter and mandate
      in_scope: Strategy, mandate, policy direction; corporate and board-level conception
      out_of_scope:
      - Operational strategy execution
      - Capability build
      evidence:
      - dea-metaframework/REPORT.md §5
      - dea-catalog-business-capabilities/capability-strategy
      - APQC PCF 7.0 Strategy Management
      disposition: ratified-accepted
      ratified_at: '2026-09-05'
      ratified_by: CR-BP-13
    Design:
      process_context: dea:pc-ge-design
      l1_candidates:
      - Governance System Design
      - Policy and Control Design
      l2_candidates:
      - Design governance framework
      - Design control objectives
      - Design policy architecture
      in_scope: Governance architecture, control objectives, policy design
      out_of_scope:
      - Operational control execution
      evidence:
      - dea-metaframework/framework/lifecycle-grounding.md §3
      - TOGAF ADM Phase G
      disposition: ratified-accepted
      ratified_at: '2026-09-05'
      ratified_by: CR-BP-13
    Build:
      process_context: dea:pc-ge-build
      l1_candidates:
      - Governance Body Establishment
      - Charter and Policy Codification
      l2_candidates:
      - Establish board and committees
      - Codify policies and standards
      in_scope: Charter, committee, policy artifact construction
      out_of_scope:
      - Hiring and capability build
      evidence:
      - ISO 37000:2021
      - dea-catalog-business-capabilities/capability-enterprise-governance
      disposition: ratified-accepted
      ratified_at: '2026-09-05'
      ratified_by: CR-BP-13
    Activate:
      process_context: dea:pc-ge-activate
      l1_candidates:
      - Governance Onboarding
      l2_candidates:
      - Onboard governance bodies
      - Activate policy regime
      in_scope: Bringing governance bodies and policy regimes live
      out_of_scope:
      - Operating model activation
      evidence:
      - TOGAF ADM Phase G Implementation Governance
      disposition: backlog-deferred
      ratified_at: '2026-09-05'
      ratified_by: CR-BP-13
      deferral_reason: |
        Activate and Retire are lifecycle transition stages, not stable Process Group operating scopes. L1 Process Groups (CR-BP-12) catalogue the bounded operating scope of a process domain; the Activate stage is the handover from Build to Operate (a sub-step of the receiving Process Group), and the Retire stage is the wind-down of the prior Process Group (a sub-step of the ending Process Group). Neither forms a stable L1 group on its own. Reconsider if a discrete Activate/Retire process identity is later identified (separate CR).
      deferral_reason: Activation is operational and is typically modelled under operations-delivery x
        activate; governance activation is an attribute of governance operate, not a standalone group.
    Operate:
      process_context: dea:pc-ge-operate
      l1_candidates:
      - Governance Oversight
      - Policy Compliance and Audit
      l2_candidates:
      - Run board and committee cycle
      - Operate enterprise risk oversight
      - Operate policy compliance
      in_scope: Board cycle, risk oversight, policy compliance execution
      out_of_scope:
      - Frontline compliance execution
      evidence:
      - ISO 37000:2021 §6
      - dea-catalog-business-capabilities/capability-compliance-management
      disposition: ratified-accepted
      ratified_at: '2026-09-05'
      ratified_by: CR-BP-13
    Improve:
      process_context: dea:pc-ge-improve
      l1_candidates:
      - Governance Review and Learning
      l2_candidates:
      - Conduct governance effectiveness review
      - Score audit findings
      in_scope: Effectiveness review of governance bodies and policy regimes
      out_of_scope:
      - Capability-specific improvement (lives in their domain)
      evidence:
      - TOGAF ADM Requirements Management
      - CR-DEA-BC-04 R-005
      disposition: ratified-accepted
      ratified_at: '2026-09-05'
      ratified_by: CR-BP-13
    Retire:
      process_context: dea:pc-ge-retire
      l1_candidates:
      - Governance Sunset
      l2_candidates:
      - Retire governance bodies
      - Sunset policies and mandates
      in_scope: Sunset of governance bodies and policies
      out_of_scope:
      - Asset and capability retirement
      evidence:
      - dea-metaframework/framework/lifecycle-grounding.md §1 Retire
      disposition: backlog-deferred
      ratified_at: '2026-09-05'
      ratified_by: CR-BP-13
      deferral_reason: |
        Activate and Retire are lifecycle transition stages, not stable Process Group operating scopes. L1 Process Groups (CR-BP-12) catalogue the bounded operating scope of a process domain; the Activate stage is the handover from Build to Operate (a sub-step of the receiving Process Group), and the Retire stage is the wind-down of the prior Process Group (a sub-step of the ending Process Group). Neither forms a stable L1 group on its own. Reconsider if a discrete Activate/Retire process identity is later identified (separate CR).
      deferral_reason: Retirement of governance is rare and largely an attribute of operating-model retirement;
        defer until a sector example (e.g. regulator-mandated unwind) requires it.
