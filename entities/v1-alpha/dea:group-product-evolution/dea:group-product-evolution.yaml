id: dea:group-product-evolution
type: ProcessGroup
version: 1.0.0

name: Product Evolution

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process responsibilities of conducting proposition performance reviews, evolving products and services, and rationalizing the portfolio in the ProductAndValue x Improve context. v2.4.0 grounding (domain-grounding.md §3.5).

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-pv-improve

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - Proposition performance review
    - Product and service evolution
    - Portfolio rationalization
  excludes:
    - Capability improvement (owning domains)
    - Portfolio performance operation (Operate stage; adjacent context)

# Intended enterprise outcomes.
outcomes:
  - Proposition performance is reviewed with findings committed.
  - Products and services are evolved with bounded enhancements.
  - Portfolio is rationalized with retire-or-pivot decisions.

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
composes:
  - source_id: dea:group-product-evolution
    target_id: dea:process-conduct-proposition-performance-review
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process belongs to this cell per register v2 (landed CR-BP-21c).
    provenance:
      type: architecture-review
      reference: CR-BP-21c.1
      asserted_by: dea-team
      asserted_at: '2026-09-08'
  - source_id: dea:group-product-evolution
