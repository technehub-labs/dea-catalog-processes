# Canonical Process Group entry: dea:group-strategy-and-governance-conception.
#
# Lands as part of CR-BP-13a (CustomerAndDemand admission tranche).
# One of four new Process Group records that, together with the
# existing dea:group-customer-lifecycle-management (Operate;
# CR-BP-12), populates the CustomerAndDemand value stream across
# the 5 accepted lifecycle stages (Conceive / Design / Build /
# Operate / Improve).
#
# Design (CR-BP-12 §4):
#   - Catalog-owned record, NOT a metamodel entity.
#   - ID family: dea:group-* (CR-BP-04 §4).
#   - Canonical containment: L1 group --composes--> L2 process.
#   - The L2 entities carry the inverse `part_of` for navigation.
#   - MECE within Process Context (PG-006) is enforced.

id: dea:group-strategy-and-governance-conception
type: ProcessGroup
version: 1.0.0

name: Strategy and Governance Conception

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organizes the Business Process responsibilities of conceiving strategy, mandate, and policy direction in the GovernanceAndExistence x Conceive context. This group captures the front-end work of framing the enterprise's governance strategy, policy posture, and charter direction. The group is the canonical Process Group for the strategy-and-governance value stream.

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-ge-c

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - Governance strategy framing
    - Policy and mandate initiation
    - Charter direction
    - Board mandate conception
  excludes:
    - Governance system design (Design stage; adjacent context)
    - Governance body establishment (Build stage; adjacent context)
    - Governance oversight (Operate stage)

# Intended enterprise outcomes.
outcomes:
  - Governance strategy is framed with a defensible mandate.
  - Policy and charter direction is committed.
  - Board mandate is articulated.

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
# This Process Group composes 2 L2 Business
# Process specialization(s) that landed as part of the same
# CR-BP-13a tranche.
composes:
  - source_id: dea:group-strategy-and-governance-conception
    target_id: dea:process-develop-governance-strategy
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process is a principal responsibility of the
      Strategy and Governance Conception value stream within CustomerAndDemand.
      This composition is canonical per CR-BP-13a.
    evidence: docs/examples/dea-group-strategy-and-governance-conception.md
    provenance:
      type: architecture-review
      reference: CR-BP-13a
      asserted_by: dea-team
      asserted_at: '2026-09-05'
  - source_id: dea:group-strategy-and-governance-conception
    target_id: dea:process-initiate-policy-and-charter
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process is a principal responsibility of the
      Strategy and Governance Conception value stream within CustomerAndDemand.
      This composition is canonical per CR-BP-13a.
    evidence: docs/examples/dea-group-strategy-and-governance-conception.md
    provenance:
      type: architecture-review
      reference: CR-BP-13a
      asserted_by: dea-team
      asserted_at: '2026-09-05'

# Process Group kind (PG-007 enforces controlled vocabulary).
process_group_kind: end-to-end

# Discovery / governance status (mirrors CR-BP-11 register values).
# 'accepted' per CR-BP-13 (research ratification). The ratified-accepted
# register value is mapped to canonical `accepted` here per the schema's
# controlled vocabulary (CR-CATALOG-STRUCT-01 §5).
status: accepted

# Catalog entry lifecycle (PG-008 enforces).
# `candidate` because full admission is gated by end-to-end MECE
# validation in a follow-up admission tranche (CR-BP-13a.1).
lifecycle_status: candidate

# ECF Conformance Gate (CR-ECF-CG-001..004).
ecfConformance:
  framework: EnterpriseConceptFramework
  contractVersion: '1.0.0'
  profile: dea:ecf@1.0.0
  status: conformant
  affiliation: inherits-catalog
  canonicalReferences:
    - kind: coordinate
      domain: GovernanceAndExistence
      stage: Conceive
      identifier: ecf:governanceExistence.conceive

# Evidence (CR-BP-11 register strength scale E0..E5).
