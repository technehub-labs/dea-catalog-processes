id: dea:group-financial-operate
type: ProcessGroup
version: 1.0.0

name: Financial Operate

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process responsibilities of day-to-day financial operations: payables, receivables, payroll, cash and liquidity, financial close, tax compliance, and financial reporting in the FinanceAndAccounting x Operate context. v2.4.0 grounding (register v2 FA/operate cell).

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-fa-operate

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - Accounts payable and receivable operation
    - Payroll execution
    - Cash and liquidity management
    - Financial close and reporting operation
    - Tax compliance and filings
    - General ledger operation (seeded by CR-BP-21e)
  excludes:
    - Financial controls design (Design stage; adjacent context)
    - Financial improvement (Improve stage; adjacent context)

# Intended enterprise outcomes.
outcomes:
  - Payables, receivables, and payroll operate to plan.
  - Cash, close, tax, and reporting operate with records.
  - General ledger operates within policy.

