# (dea:ecf@1.0.0); the canonical references resolve to the
# ECF Domain (CustomerAndDemand) and Stage (Operate) of the
# Process Context the entry belongs to.
ecfConformance:
  framework: EnterpriseConceptFramework
  contractVersion: '1.0.0'
  profile: dea:ecf@1.0.0
  status: conformant-with-extension
  affiliation: inherits-catalog
  canonicalReferences:
    - kind: coordinate
      domain: CustomerAndDemand
      stage: Operate
      identifier: ecf:customerDemand.operate
  extensions:
    - name: process_intent
      doesNotRedefine: true
      rationaleRef: change-requests/CR-BP-SPEC-BP-01.md
    - name: process_type
      doesNotRedefine: true
