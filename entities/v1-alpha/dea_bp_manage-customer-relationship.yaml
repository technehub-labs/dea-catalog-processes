# Canonical Business Process entry for `dea:process-manage-customer-relationship`.
#
# This is the FIRST Business Process entry in the catalog,
# landing as part of CR-BP-03C. It exercises every part of the
# CR-BP-03 / CR-BP-03A / CR-BP-02 machinery:
#
#   - 4-axis classification (intent / type / specialization / audience)
#   - Process Identity contract (verb + object + outcome + evidence)
#   - Canonical relationships (array-of-relationship-instances,
#     per metamodel relationship-instance.json)
#   - L0/L1/L2 conceptual hierarchy (Scope + Group recorded in
#     metadata; not promoted to entities)
#   - Process Context reference (the entry belongs to the
#     CustomerAndDemand x Operate cell; see
#     contexts/v1-alpha/dea_pc-cd-op.yaml)
#
# This entry uses the **canonical** form per CR-BP-03A:
#   - NO `parent_process` (REMOVED in CR-BP-03A)
#   - NO `child_processes` (REMOVED in CR-BP-03A)
#   - NO `capabilities_delivered` (soft-deprecated; the
#     canonical form is relationships[relationship_type=realizes])
#   - YES `relationships` array (array-of-relationship-instances;
#     each entry has source_id, target_id, relationship_type,
#     provenance, etc.)
#
# See: change-requests/CR-BP-03C-sample-process-contribution.md

id: dea:process-manage-customer-relationship
name: Manage Customer Relationship
type: Process
version: 1.0.0
lifecycle_status: candidate
status: candidate

# Classification (CR-BP-03 §2.1; CR-BP-SPEC-BP-01 §3)
process_intent: management
process_audience: customer-demand

# Classification — CR-BP-03 §2.1 (new; 5-value Mintzberg vocabulary)
process_type: management

# Classification — CR-BP-03 §2.1 (new; inheritance / pattern-based refinement)
# This is the ROOT of the customer-relationship specialization;
# future specializations (e.g. dea:bp:manage-enterprise-customer)
# will declare THIS id in their process_specialization list.
process_specialization: []

description: |
  Manage the day-to-day operation of an active customer
  relationship across its lifecycle (acquisition → onboarding
  → active use → renewal or win-back). The principal
  organizational locus is the Middle Line (sales / account
  management leadership); the work coordinates customer-
  facing resources, monitors the customer's value exchange
  with the enterprise, and allocates attention and effort
  across the customer portfolio.

# Trigger (BP-ARC-ID-002): what initiates the process.
trigger: |
  A customer enters the active relationship lifecycle
  (post-onboarding handoff from the Activate stage) or an
  existing active customer signals a change in their
  relationship status (escalation, churn risk, renewal
  approaching, win-back opportunity).

# Outcome (BP-ARC-ID-003): what the process produces.
outcome: |
  An active customer relationship is sustained across its
  lifecycle through allocation of attention, escalation
  handling, and renewal coordination.

# Process Context (CR-BP-02)
process_context: dea:pc-cd-op

# Process Identity (CR-BP-03 §5.4)
identity:
  verb: Manage
  object: Customer Relationship
  scope: (all customer segments)
  outcome_statement: |
    An active customer relationship is sustained across its
    lifecycle (acquisition → onboarding → active use → renewal
    or win-back) through allocation of attention, escalation
    handling, and renewal coordination.
  evidence_links:
    - type: standard
      ref: https://www.apqc.org/resource-library/resource-collections/56391
    - type: documentation
      ref: docs/examples/manage-customer-relationship.md

# Canonical relationships (CR-BP-03 §6; CR-BP-03A §3.1)
# Array-of-relationship-instances per metamodel
# relationship-instance.json. Each entry has source_id,
# target_id, relationship_type, plus optional direction,
# status, effective_from/to, asserted_by, rationale, evidence,
# and provenance.
relationships:
  - source_id: dea:process-manage-customer-relationship
    target_id: dea:entity-capability:manage-customer-relationship
    relationship_type: realizes
    status: active
    direction: source-to-target
    rationale: |
      The Business Process realizes the Business Capability
      `Manage Customer Relationship`. The capability is the
      abstract "what the enterprise can do"; the process is
      the structured "how it does it".
    asserted_by: dea-team
    asserted_at: '2026-09-03'
    provenance:
      type: manual
      asserted_by: dea-team
      asserted_at: '2026-09-03'
      evidence: https://www.apqc.org/resource-library/resource-collections/56391

# ECF Conformance Gate (CR-ECF-CG-001..004; enforced by
# scripts/check_ecf_conformance.py on every catalog entry).
