    id: dea:scope-customer-facing-operations
    name: Customer-facing operations
    description: |
      All enterprise work that involves direct interaction
      with the customer base (demand, fulfilment, support,
      relationship management).
  group:
    id: dea:group-customer-lifecycle-management
    name: Customer Lifecycle Management
    description: |
      Loose grouping of business processes that participate
      in the customer lifecycle (acquisition → retention →
      win-back). Group ≠ Business Function.
  change_history:
