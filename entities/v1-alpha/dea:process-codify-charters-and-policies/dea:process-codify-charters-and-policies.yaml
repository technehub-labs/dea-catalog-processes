# may declare this id in their process_specialization list.
process_specialization: []

description: |
  Operate the Codify Charters and Policies L2 process within the
  dea:pc-ge-b Cell Charter. See trigger and outcome for
  the bounded work this process owns; see identity.outcome_statement
  for the testable outcome the process produces.

# Trigger (BP-ARC-ID-002): what initiates the process.
trigger: |
  Governance bodies are being established; the associated charters, policies, and standard artefacts must be codified for the bodies to operate.

# Outcome (BP-ARC-ID-003): what the process produces.
outcome: |
  Charters, policies, and standard artefacts are codified and accessible to the governance bodies.

# Process Context (CR-BP-02).
process_context: dea:pc-ge-b

# Process Identity (CR-BP-03 §5.4).
identity:
  verb: Codify
  object: Charters and Policies
  scope: (all customer segments)
  outcome_statement: |
    Charters, policies, and standard artefacts are codified, accessible to the governance bodies, and ready to be operated on.
  evidence_links:
    - type: standard
      ref: https://www.opengroup.org/togaf
    - type: documentation
      ref: docs/examples/codify-charters-and-policies.md

