id: dea:group-agent-acquisition-and-onboarding
type: ProcessGroup
version: 1.0.0

name: Agent Acquisition and Onboarding

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process responsibilities of acquiring and onboarding agents of all substrates in the AgencyAndOrganization x Build context: sourcing and recruiting human talent, provisioning artificial agents (model deployment, API integration), onboarding and integrating agents, and building the contractor and partner-agent pool. v2.4.0 grounding (domain-grounding.md §3.3, Acquisition and Onboarding sub-concern).

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-ao-build

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - Agent sourcing, recruiting, provisioning (all substrates)
    - Agent onboarding and integration
    - Contractor and partner-agent pool build
  excludes:
    - Supplier relationship onboarding (party-relationship)
    - Agent topology design (Design stage; adjacent context)
    - Agent performance operation (Operate stage; adjacent context)

# Intended enterprise outcomes.
outcomes:
  - Agents are acquired and onboarded per the designed topology.
  - Contractor and partner-agent pool is built with vetted sources.

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
composes:
  - source_id: dea:group-agent-acquisition-and-onboarding
    target_id: dea:process-acquire-and-onboard-agents
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process belongs to this cell per register v2 (landed CR-BP-21b).
    provenance:
      type: architecture-review
      reference: CR-BP-21b.1
      asserted_by: dea-team
      asserted_at: '2026-09-08'
