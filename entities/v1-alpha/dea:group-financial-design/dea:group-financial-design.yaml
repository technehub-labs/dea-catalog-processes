id: dea:group-financial-design
type: ProcessGroup
version: 1.0.0

name: Financial Design

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process responsibilities of designing the enterprise's financial controls, tax position, and treasury model in the FinanceAndAccounting x Design context. v2.4.0 grounding (register v2 FA/design cell).

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-fa-design

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - Financial controls and policy design
    - Tax position and strategy design
    - Treasury and funding model design
    - Financial plan structure design (seeded by CR-BP-21e)
  excludes:
    - Financial strategy framing (Conceive stage; adjacent context)
    - Financial system build (Build stage; adjacent context)

# Intended enterprise outcomes.
outcomes:
  - Financial controls, tax position, and treasury model are designed to the approved architecture.
  - Designs are ready for financial system build.

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
composes:
  - source_id: dea:group-financial-design
    target_id: dea:process-design-financial-plan-structure
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process belongs to this cell per register v2 (landed CR-BP-21e).
    provenance:
      type: architecture-review
      reference: CR-BP-21e.1
      asserted_by: dea-team
      asserted_at: '2026-09-08'
