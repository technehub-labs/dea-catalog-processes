id: dea:group-product-development
type: ProcessGroup
version: 1.0.0

name: Product Development

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process responsibilities of building product variants, service capabilities, innovation prototypes, and market readiness in the ProductAndValue x Build context. v2.4.0 grounding (domain-grounding.md §3.5).

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-pv-build

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - Product variant development
    - Service capability build
    - Innovation prototype build
    - Market readiness preparation
  excludes:
    - Technology build (enablement-operations)
    - Proposition design (Design stage; adjacent context)
    - Catalogue operation (Operate stage; adjacent context)

# Intended enterprise outcomes.
outcomes:
  - Product variants and service capabilities are built.
  - Innovation prototypes are built for hypothesis testing.
  - Market readiness is prepared with go-to-market assets.

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
composes:
  - source_id: dea:group-product-development
    target_id: dea:process-develop-product-variants
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process belongs to this cell per register v2 (landed CR-BP-21c).
    provenance:
      type: architecture-review
      reference: CR-BP-21c.1
      asserted_by: dea-team
      asserted_at: '2026-09-08'
