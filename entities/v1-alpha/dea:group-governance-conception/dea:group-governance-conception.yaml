# Canonical Process Group entry: dea:group-governance-conception.
#
# Lands as part of CR-BP-13a (GovernanceAndExistence admission tranche).
# Renamed and re-scoped under CR-BP-20 (Option A GE/SD split per user
# direction, 2026-09-07): strategy conception migrated to StrategyAndDirection;
# this group now organises governance-mandate, policy, and charter conception
# only. The contained L2 `dea:process-develop-governance-strategy` is parked
# for migration to StrategyAndDirection × Conceive in CR-BP-21a (landing).

id: dea:group-governance-conception
type: ProcessGroup
version: 1.1.0

name: Governance Conception

# Normative definition (PG-006 / MECE).
definition: |
  The bounded Process Group that organises the Business Process responsibilities
  of conceiving the governance mandate, policy direction, and charter of the
  enterprise in the GovernanceAndExistence × Conceive context. This group
  captures the front-end work of framing what the enterprise is authorised to
  exist as: its mandate, its policy posture, and its charter direction.
  Strategic direction choices — including corporate strategy — belong in
  StrategyAndDirection × Conceive (dea:pc-sd-conceive, planned CR-BP-21a) per
  domain-grounding.md §3.1 ("Governance authorizes but does not direct;
  Strategy & Direction directs within the authorized frame").

# Process Context reference (PG-003 enforces resolution).
process_context: dea:pc-ge-c

# Scope (MECE boundary; PG-006 depends on excludes).
scope:
  includes:
    - Charter and mandate conception
    - Policy and standards conception
    - Board mandate conception
    - Risk and control framework direction
  excludes:
    - Strategic direction choices (strategy-direction x conceive)
    - Corporate strategy development (strategy-direction x conceive; CR-BP-21a)
    - Governance system design (Design stage; adjacent context)
    - Governance body establishment (Build stage; adjacent context)
    - Governance oversight (Operate stage)

# Intended enterprise outcomes.
outcomes:
  - Governance mandate is framed with a defensible authority basis.
  - Policy and charter direction is committed.
  - Board mandate is articulated.
  - Risk and control framework direction is set.

# Canonical containment (PG-004 / PG-005 / PG-006 enforce).
# This Process Group composes 2 L2 Business
# Process specialization(s). The second L2 (develop-governance-strategy) is
# the future-migration candidate for the SD-Conceive cell; it remains
# composed here until CR-BP-21a lands the SD cell.
composes:
  - source_id: dea:group-governance-conception
    target_id: dea:process-develop-governance-strategy
    relationship_type: composes
    direction: source-to-target
    status: planned
    scheduled_to: dea:group-strategy-direction-conception
    scheduled_by: CR-BP-21a
    asserted_by: dea-team
    rationale: |
      The L2 process develops corporate strategy, which v2.4.0 places in
      StrategyAndDirection × Conceive (grounding §3.1 + §3.2). It remains
      composed here pending CR-BP-21a landing the SD cell; the
      'planned' status with the scheduled_to field records the planned move.
    evidence: docs/examples/develop-governance-strategy.md
    provenance:
      type: architecture-review
      reference: CR-BP-20
      asserted_by: dea-team
      asserted_at: '2026-09-07'
  - source_id: dea:group-governance-conception
    target_id: dea:process-initiate-policy-and-charter
    relationship_type: composes
    direction: source-to-target
    status: active
    asserted_by: dea-team
    rationale: |
      The L2 process is a principal responsibility of the Governance
      Conception value stream: framing the mandate and policy direction of
      the enterprise (charter initiation, policy conception).
    evidence: docs/examples/initiate-policy-and-charter.md
    provenance:
      type: architecture-review
      reference: CR-BP-13a
      asserted_by: dea-team
      asserted_at: '2026-09-05'

# Process Group kind (PG-007 enforces controlled vocabulary).
process_group_kind: end-to-end

