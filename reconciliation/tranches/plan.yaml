  rationale: 'The two records in this tranche share a clean RECLASSIFY

    pattern: legacy "operational" intent -> canonical "operate";

    legacy scalar `process_context` -> canonical `context:` block;

    legacy `process_audience` removed (CR-BP-14 /13). No identity

    changes; no renames; no specialization. The migration is

    text-only and self-contained.

    '
