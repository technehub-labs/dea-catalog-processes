  context_ref: dea:pc-ge-b
  context_name: governance / build
  owner: TBD
  risk: high
  expected_dispositions:
  - RECLASSIFY
  pr_target: PR-8
  records:
  - dea:process-codify-charters-and-policies
  - dea:process-establish-governance-bodies
  rationale: 'The two records carry a 13b-generator artifact

    (`process_audience: party-relationship`) that contradicts their

    canonical context (`dea:pc-ge-b` = governance / build). The

    RECLASSIFY migrates the legacy audience to the canonical

    `context:` block and resolves the contradiction.

    High-risk tranche: this is the first tranche that changes

    the audience-vs-context relationship in a visible way; it

    MUST be reviewed against the canonical governance register

    before merge (CR-BP-15 /7 governance gate).

    '
