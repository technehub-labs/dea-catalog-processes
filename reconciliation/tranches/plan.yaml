ordering_rationale: 'The 10 Process Contexts map to the ECF matrix

  (CR-ECF-CG-004). Tranches are independent; the canonical order

  groups by ECF Domain (cd = party-relationship; ge = governance)

  and within domain by Lifecycle Stage (b < c < d < im < op).

  This ordering is a presentation convention; the per-tranche

  migrations (CR-BP-15-IMP Phases 5-7) MAY be executed in any

  order or in parallel.

  '
