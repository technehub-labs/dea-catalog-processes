  - dea:process-market-and-demand-conception
  rationale: 'The two records'' display names already use "Develop" / market-

    intelligence verbs, so RECLASSIFY primarily changes the intent

    vocabulary (management -> develop) and the context block.

    No identity changes; the slug "customer-strategy-conception"

    is a legacy artifact NOT a RENAME target (Phase 4).

    '
