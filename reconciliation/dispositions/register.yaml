    rationale: |
      The record's identity, name and process_type are sound. The
      legacy `process_intent: operational` maps to the canonical
      `operate` vocabulary (CR-BP-14 /17). The legacy scalar
      `process_context` migrates to the canonical `context:` block
      (CR-BP-14 /13, BP-SEM-007). The `process_audience` legacy
      alias is removed because the canonical `context:` block
      already declares the ECF Domain x Lifecycle placement.
    evidence: |
      CR-BP-14 /17 mapping table; CR-BP-14 /13 audience vs context
      separation; the record's name ("Build Customer Acquisition
      Channels") and outcome statement establish that the work is
      operational in nature (operate).
