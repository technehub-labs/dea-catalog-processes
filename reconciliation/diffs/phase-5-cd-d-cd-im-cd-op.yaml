# Cross-tranche observations
observations:
  - |
    The 5 migrated records no longer trigger BP-SEM-007
    (canonical context: block required). The Phase 5 first
    + second tranches have reduced the BP-SEM error count
    from 18 to 9; the remaining 9 errors will be addressed
    by Phase 5 third tranche (ge-b + ge-c + ge-d + ge-im)
    and fourth tranche (ge-op).
  - |
    cd-d is now 3 records sharing the same canonical context
    block (dea:pc-pr-d). Future Phase 6 work may consider
    whether any of these 3 records are specializations of a
    common base (CR-BP-14 S23); the disposition register
    currently records all 3 as RECLASSIFY, not SPECIALIZE.
  - |
    `dea:process-manage-customer-relationship` already had a
    `realizes` relationship toward a capability (carried from
    the original CR-BP-13a admission); the migration
    preserves it and adds a parallel `serves` toward the ECF
    coordinate. Both relationships are canonical; the script's
    idempotence guard ensures no duplicates.
  - |
    The `process_intent` migration from `management` to
    `manage` (in `manage-customer-relationship`) is the first
    case where the legacy vocabulary maps to a closely-named
    canonical token. The disposition register records the
    rationale: management is not canonical because the
    CR-BP-14 /17 intent vocabulary is seven-valued and
    precise; "management" is reserved for the L1 conceptual
    layer (Process Group), not the L2 (Business Process).