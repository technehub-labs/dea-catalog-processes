# Cross-tranche observations
observations:
  - |
    The 7 migrated records no longer trigger BP-SEM-007
    (canonical context: block required). Phase 5 third
    tranche reduces the BP-SEM error count from 9 to 2.
    The remaining 2 records (operate-governance-oversight
    and audit-policy-compliance) are addressed in Phase 5
    fourth tranche (ge-op; PR-9).
  - |
    The ge-im tranche holds a single record
    (`review-governance-effectiveness`). Its intent
    migration from `management` to `govern` reflects the
    ECF Improve context semantics: review-and-correction
    work is governance activity, not project-management
    activity. The disposition register records the
    rationale explicitly.
  - |
    The ge-c tranche demonstrates the most semantically
    diverse intent pair:
    `develop-governance-strategy` (-> develop) and
    `initiate-policy-and-charter` (-> manage). The two
    records share the same context (conceive) but
    different intent: strategy development is creative
    (develop); charter initiation is operational
    governance (manage). The disposition register's
    per-record rationale captures the distinction.
  - |
    The ge-d tranche holds 2 records both mapped to
    `develop` intent, consistent with the Design context
    semantics. Together with ge-c, ge-d forms the L2
    conceptual foundation of the governance landscape.
  - |
    No records in this tranche triggered the
    high-risk audience-vs-context flag raised in the
    Phase 4 tranche plan. The legacy `process_audience`
    value `governance-existence` mapped cleanly to
    the `dea:pc-ge-*` context scalars. PR-9 (ge-op)
    remains the high-risk migration due to the
    cross-tranche audit-policy record.